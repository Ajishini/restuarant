<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliciano Restaurant</title>

    <link rel="stylesheet" href="reservation-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- <section1> -->

    <div class="reservation-section">

        <div class="reservation-box" data-aos="flip-left" data-aos-easing="ease-out-cubic" data-aos-duration="2000">

            <div class="reservation-header">

                <span class="reservation-script">
                    Book a table
                </span>

                <h1>
                    Make Reservation
                </h1>

            </div>

            <form class="reservation-form">

                <div class="input-box">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>

                <div class="input-box">
                    <label>Phone</label>
                    <input type="text" placeholder="Phone">
                </div>

                <div class="input-box">
                    <label>Date</label>
                    <input type="date">
                </div>

                <div class="input-box">
                    <label>Time</label>
                    <input type="time">
                </div>

                <div class="input-box">
                    <label>Person</label>
                    <select>
                        <option>Person</option>
                        <option>1 Person</option>
                        <option>2 Persons</option>
                        <option>3 Persons</option>
                        <option>4 Persons</option>
                    </select>
                </div>

            </form>

            <a href="web.html" class="reserve-btn">
                Make a Reservation
            </a>

        </div>

    </div>

<!-- </section1> -->

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  AOS.init();
</script>

</body>
</html>
